<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>查詢分析｜臺灣醫療資源分析系統</title>
<link rel="stylesheet" href="../../shared/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../../shared/styles.css"><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><strong>臺灣醫療資源分析系統</strong><button class="text-button" id="aboutButton" type="button">ⓘ 關於本專案</button></header>
<div class="workspace">
<nav class="sidebar" aria-label="主導覽">
<button class="nav-item" type="button" disabled><span class="nav-icon" aria-hidden="true">⌂</span><span>首頁<small>尚未開放</small></span></button>
<a class="nav-item active" href="./index.html" aria-current="page"><span class="nav-icon" aria-hidden="true">⌕</span><span>查詢分析</span></a>
<a class="nav-item" href="../district/index.html"><span class="nav-icon" aria-hidden="true">▤</span><span>行政區查詢</span></a>
<button class="nav-item" type="button" disabled><span class="nav-icon" aria-hidden="true">♧</span><span>圖形關係<small>尚未開放</small></span></button>
<button class="nav-item" type="button" disabled><span class="nav-icon" aria-hidden="true">ⓘ</span><span>資料介紹<small>尚未開放</small></span></button>
</nav>
<main>
<div class="page-heading"><h1>查詢分析</h1><span class="mode-label">模擬查詢模式</span></div>
<p class="subtitle">輸入 Cypher 查詢，並在地圖上顯示結果</p>
<div class="analysis-grid">
<div class="query-column">
<section class="query-panel" aria-label="查詢設定">
<div class="mode-tabs" role="tablist" aria-label="查詢模式">
<button id="cypherTab" class="mode-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="cypherPane" tabindex="0" data-mode="cypher">Cypher 查詢</button>
<button id="builderTab" class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="builderPane" tabindex="-1" data-mode="builder">條件篩選</button>
</div>
<form id="cypherPane" class="mode-pane is-active" role="tabpanel" aria-labelledby="cypherTab" data-pane="cypher">
<div class="panel-heading"><h2>Cypher 查詢</h2><label class="example-label">範例查詢<select id="exampleQuery" aria-label="範例查詢"></select></label></div>
<label class="sr-only" for="cypherInput">Cypher 查詢內容</label><textarea id="cypherInput" spellcheck="false" rows="5"></textarea>
<div class="actions"><button class="primary" type="submit">▶ 執行查詢</button><button id="clearCypher" class="secondary" type="button">清除</button></div>
<p id="cypherStatus" class="status" role="status" aria-live="polite"></p>
</form>
<form id="builderPane" class="mode-pane" role="tabpanel" aria-labelledby="builderTab" data-pane="builder" hidden>
<div class="panel-heading"><h2>條件篩選</h2></div>
<div class="filter-fields">
<label>縣市<select id="county"><option value="">全部縣市（示範資料）</option></select></label>
<label>平均所得最低門檻（千元）<input id="minIncome" type="number" min="0" step="1" placeholder="不限"></label>
<label>醫院家數最大值<input id="maxHospitals" type="number" min="0" step="1" placeholder="不限"></label>
<label>診所家數最小值<input id="minClinics" type="number" min="0" step="1" placeholder="不限"></label>
</div>
<div class="actions"><button class="primary" type="submit">執行篩選</button><button class="secondary" type="reset">重設</button></div>
</form>
</section>
<section class="results-panel" aria-labelledby="resultsTitle">
<div class="panel-heading"><h2 id="resultsTitle">查詢結果 <span class="count">（共 <b id="resultCount">0</b> 筆）</span></h2><button id="downloadCsv" class="secondary compact" type="button">↓ 下載 CSV</button></div>
<p id="queryModeLabel" class="result-source"></p>
<div class="table-scroll"><table><thead><tr><th scope="col">#</th><th scope="col"><button type="button" data-sort="name">地區 ↕</button></th><th scope="col"><button type="button" data-sort="averageIncome">平均所得<br>（千元）↕</button></th><th scope="col"><button type="button" data-sort="hospitalCount">醫院<br>家數 ↕</button></th><th scope="col"><button type="button" data-sort="clinicCount">診所<br>家數 ↕</button></th></tr></thead><tbody id="resultRows"></tbody></table></div>
<p id="resultsEmpty" class="empty" role="status" hidden>沒有符合條件的示範資料。</p>
<p class="data-notice">統計數值均為虛構，非政府統計；行政區座標僅供展示。</p>
</section>
</div>
<section class="map-panel" aria-labelledby="mapTitle">
<div class="panel-heading"><h2 id="mapTitle">地圖顯示</h2><span id="markerCount" class="map-count">0 個標記</span></div>
<div class="map-wrap"><div id="map" aria-label="臺灣行政區互動地圖"></div>
<button id="resetMap" class="map-home" type="button" title="返回臺灣全圖" aria-label="返回臺灣全圖">⌂</button>
<div class="legend"><strong>平均所得（千元）</strong><span><i class="level-4"></i>≥ 2000</span><span><i class="level-3"></i>1800–1999</span><span><i class="level-2"></i>1600–1799</span><span><i class="level-1"></i>&lt; 1600</span></div>
</div><p id="mapStatus" class="map-status" role="status" hidden></p>
</section>
</div>
</main>
</div>
<dialog id="aboutDialog"><h2>關於本專案</h2><p>臺灣醫療資源分析系統前端雛形。所有查詢均使用示範資料，尚未連接資料庫或執行真正的 Cypher。</p><form method="dialog"><button class="secondary">關閉</button></form></dialog>
<script src="../../shared/vendor/leaflet/leaflet.js"></script><script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-base" content="https://advanced-db-project-s6bd.onrender.com">
<title>行政區查詢｜臺灣醫療資源分析系統</title>
<link rel="stylesheet" href="../../shared/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../../shared/styles.css"><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="facility-detail.css">
</head>
<body>
<header class="topbar"><strong>臺灣醫療資源分析系統</strong><button class="text-button" id="aboutButton" type="button">ⓘ 關於本專案</button></header>
<div class="workspace">
<nav class="sidebar" aria-label="主導覽">
<a class="nav-item" href="../query/index.html"><span class="nav-icon" aria-hidden="true">⌕</span><span>查詢分析</span></a>
<a class="nav-item active" href="./index.html" aria-current="page"><span class="nav-icon" aria-hidden="true">▤</span><span>行政區查詢</span></a>
<a class="nav-item" href="../graph/index.html"><span class="nav-icon" aria-hidden="true">♧</span><span>圖形關係</span></a>
<a class="nav-item" href="../data/index.html"><span class="nav-icon" aria-hidden="true">ⓘ</span><span>資料介紹</span></a>
</nav>
<main>
<div class="page-heading"><h1>行政區查詢</h1></div>
<div class="district-grid">
<div class="search-column">
<form id="districtForm" aria-label="行政區搜尋">
<div class="fields">
<label for="county">縣市<select id="county" required disabled><option value="">載入縣市中…</option></select></label>
<label for="district">鄉鎮市區<select id="district" disabled><option value="">請先選擇縣市</option></select></label>
<label for="facilityType">院所類型<select id="facilityType"><option value="all">全部</option><option value="hospital">醫院</option><option value="clinic">診所</option></select></label>
<label for="facilityDepartment">院所科別<select id="facilityDepartment" disabled><option value="">不限</option></select></label>
</div>
<div class="search-actions"><button id="searchButton" class="primary" type="submit" disabled>搜尋</button></div>
</form>
<p class="search-status">目前院所清單：政府公開資料經自行處理，與 114 年官方院所彙總為不同統計口徑。</p>
<p id="departmentCatalogStatus" class="error-message" role="status" hidden></p>
<p id="catalogError" class="error-message" role="alert" hidden></p>
<button id="retryCatalog" class="secondary" type="button" hidden>重新載入行政區</button>
<section class="results" aria-labelledby="resultsTitle" aria-busy="false">
<div class="results-heading"><h2 id="resultsTitle">搜尋結果</h2><span id="totalCount" class="result-count">尚未搜尋</span></div>
<p id="searchStatus" class="search-status" role="status" aria-live="polite">請選擇縣市。</p>
<p id="locationNotice" class="location-notice" hidden></p>
<p id="assignmentNotice" class="location-notice" hidden></p>
<ul id="facilityResults" class="facility-list" aria-label="醫療院所結果"></ul>
</section>
</div>
<section class="map-column" aria-labelledby="mapTitle">
<div class="map-heading"><h2 id="mapTitle">院所位置</h2><span id="markerCount" class="map-count">0 個標記</span></div>
<div class="map-wrap"><div id="map" aria-label="醫療院所互動地圖"></div>
<button id="resetMap" class="map-home" type="button" title="返回臺灣全圖" aria-label="返回臺灣全圖">⌂</button>
<div class="map-legend"><span><i class="hospital-dot"></i>醫院</span><span><i class="clinic-dot"></i>診所</span></div>
</div><p id="mapStatus" class="map-status" role="status" hidden></p>
</section>
</div>
</main>
</div>
<aside id="facilityDetail" class="facility-detail" role="dialog" aria-modal="false" aria-labelledby="detailTitle" hidden>
<header class="detail-header"><div class="detail-toolbar"><span class="detail-eyebrow">院所詳情</span><button id="detailClose" class="detail-icon-button" type="button" title="關閉院所詳情" aria-label="關閉院所詳情"></button></div>
<div class="detail-identity"><span id="detailType" class="detail-type" hidden></span><h2 id="detailTitle" tabindex="-1">院所詳情</h2></div>
</header>
<div id="detailScroll" class="detail-scroll" tabindex="-1">
<p id="detailStatus" class="detail-status" role="status" aria-live="polite"></p>
<button id="detailRetry" class="secondary" type="button" hidden>重新載入</button>
<div id="detailContent" hidden></div>
</div>
<footer id="detailActions" class="detail-actions" hidden><a id="detailCall" class="detail-call" role="link" aria-disabled="true" tabindex="-1">撥打電話</a><button id="detailLocate" class="detail-locate" type="button">在地圖上定位</button><a id="detailGoogle" class="detail-google" target="_blank" rel="noopener noreferrer">Google 地圖<span class="sr-only">（另開分頁）</span></a><p id="detailActionHint" class="detail-action-hint" hidden></p></footer>
</aside>
<dialog id="aboutDialog"><h2>關於本專案</h2><p>臺灣醫療資源分析系統。行政區查詢使用實際院所資料；查詢分析頁面使用政府統計資料。</p><form method="dialog"><button class="secondary">關閉</button></form></dialog>
<script src="../../shared/vendor/leaflet/leaflet.js"></script><script type="module" src="app.js"></script>
</body>
</html>
